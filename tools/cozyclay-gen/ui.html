<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CozyClay 영상 만들기</title>
<style>
:root{color-scheme:dark;--panel:#191b20;--line:#2c3038;--muted:#9ba1ad;--blue:#5b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#202b43,#101114 60%);color:#f4f6fa;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1240px;margin:auto;padding:42px 28px 56px}.top{margin-bottom:28px}.brand{font-size:20px;font-weight:700}.ready{font-size:12px;color:#83d5a5;margin-left:10px}.eyebrow{color:#7ea4ff;font-size:12px;font-weight:700;letter-spacing:.08em}.title{font-size:34px;line-height:1.2;letter-spacing:-.04em;margin:8px 0 10px}.sub{color:var(--muted);margin:0 0 30px}.grid{display:grid;grid-template-columns:minmax(360px,470px) 1fr;gap:22px;align-items:start}.card{background:#191b20f0;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 18px 50px #0003}.step{display:flex;gap:12px;margin-bottom:18px}.num{width:26px;height:26px;border-radius:50%;background:#273453;color:#bcd0ff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.step h2{font-size:16px;margin:1px 0 4px}.step p{font-size:13px;color:var(--muted);margin:0}.field{margin:0 0 20px}label{display:block;font-weight:600;margin-bottom:7px}input[type=file],textarea,select,input[type=number]{width:100%;background:#101216;color:#f4f6fa;border:1px solid #3a3f4a;border-radius:9px;padding:11px;font:inherit}textarea{height:145px;resize:vertical;line-height:1.55}.hint{font-size:12px;color:var(--muted);font-weight:400}.hint a{color:#8eafff}.thumb{display:block;max-width:100%;max-height:120px;margin-top:10px;border-radius:8px;border:1px solid var(--line)}details{border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;color:#c8cdd7;font-size:13px;font-weight:600}.advanced{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.advanced label{font-size:12px;color:var(--muted);font-weight:500}.advanced .full{grid-column:1/-1}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:22px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.result{min-height:500px;display:flex;flex-direction:column}.result h2{font-size:16px;margin:0 0 14px}.empty{flex:1;min-height:390px;border:1px dashed #3b414d;border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty strong{display:block;color:#d9dee8;margin-bottom:6px}.empty small{font-size:12px}.result video{width:100%;max-height:620px;background:#0b0c0e;border-radius:12px;display:none}.status{min-height:24px;color:#aeb6c5;font-size:13px;margin-top:14px}.hist{margin-top:12px}.hist a{color:#8eafff;font-size:13px}.last{display:none}.last.show{display:block}@media(max-width:800px){.shell{padding:24px 16px}.grid{grid-template-columns:1fr}.title{font-size:28px}.result{min-height:360px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">CozyClay <span class="ready" id="health">확인 중…</span></div></header><div class="eyebrow">VIDEO GENERATOR</div><h1 class="title">참조 이미지로 장면을 만들어보세요</h1><p class="sub">이미지를 넣고 원하는 움직임을 적으면, CozyClay가 영상을 생성합니다.</p><div class="grid"><section class="card">
<div class="step"><span class="num">1</span><div><h2>참조 이미지 넣기</h2><p>인물의 포즈와 카메라 구도를 알려주는 이미지입니다.</p></div></div><div class="field"><label for="img1">첫 이미지</label><input type="file" id="img1" accept="image/*"><img id="thumb1" class="thumb" hidden></div><div class="field last" id="lastWrap"><label for="img2">마지막 이미지 <span class="hint">선택사항</span></label><input type="file" id="img2" accept="image/*"></div>
<div class="step"><span class="num">2</span><div><h2>장면 설명하기</h2><p>인물이 무엇을 어떻게 하는지 자연스럽게 적어주세요.</p></div></div><div class="field"><label for="prompt">장면 설명 <span class="hint">예: 인물이 천천히 고개 숙여 인사하고 다시 정면을 바라본다.</span></label><textarea id="prompt" placeholder="원하는 동작과 분위기를 적어주세요."></textarea><div class="hint"><a href="#" id="tpl">추천 문장 넣기</a></div></div>
<div class="field"><label for="mode">생성 방식</label><select id="mode"><option value="ref">참조 이미지 → 영상</option><option value="i2v">첫·마지막 이미지 사이 영상</option><option value="t2v">텍스트만으로 영상</option></select></div><details><summary>고급 설정 (기본값 권장)</summary><div class="advanced"><div><label>길이(초)</label><input id="sec" type="number" value="15" min="2" max="15"></div><div><label>화면 비율</label><select id="ar"><option>16:9</option><option>9:16</option><option>4:3</option><option>1:1</option></select></div><div><label>시드</label><input id="seed" type="number" value="42"></div><div><label>품질 단계</label><select id="steps"><option>4</option><option>8</option></select></div><div class="full"><label>오디오</label><select id="audio"><option value="0">오디오 없음</option><option value="1">오디오 켜기</option></select></div><input id="mp" type="hidden" value="0.4"></div></details><button id="go">영상 만들기</button><div class="status" id="status" aria-live="polite"></div>
</section><section class="card result"><h2>결과 영상</h2><div class="empty" id="empty"><div><strong>아직 만들어진 영상이 없습니다</strong><small>왼쪽에서 이미지를 넣고 장면을 설명한 뒤<br>‘영상 만들기’를 눌러주세요.</small></div></div><video id="v" controls autoplay loop muted playsinline></video><div class="hist" id="hist"></div></section></div></main>
<script>const $=s=>document.querySelector(s),base=location.origin;fetch(base+'/health').then(r=>r.json()).then(j=>$('#health').textContent=j.models_loaded?'준비됨':'모델 준비 중…').catch(()=>$('#health').textContent='오프라인');$('#img1').onchange=e=>{const f=e.target.files[0];if(f){$('#thumb1').src=URL.createObjectURL(f);$('#thumb1').hidden=false}};$('#mode').onchange=()=>$('#lastWrap').classList.toggle('show',$('#mode').value==='i2v');$('#tpl').onclick=async e=>{e.preventDefault();$('#prompt').value=await(await fetch(base+'/prompt-template?mode='+($('#mode').value==='ref'?'ref':$('#img2').files[0]?'fl2v':'i2v'))).text()};$('#go').onclick=async()=>{const fd=new FormData();for(const [k,id] of [['prompt','prompt'],['seconds','sec'],['megapixels','mp'],['aspect','ar'],['seed','seed'],['steps','steps'],['audio','audio']])fd.append(k,$('#'+id).value);const m=$('#mode').value;fd.append('mode',m==='ref'?'ref':'i2v');const f1=$('#img1').files[0],f2=$('#img2').files[0];if(m==='ref'&&f1)fd.append('ref',f1,f1.name);if(m==='i2v'&&f1)fd.append('first',f1,f1.name);if(m==='i2v'&&f2)fd.append('last',f2,f2.name);$('#go').disabled=true;const t0=Date.now(),tick=setInterval(()=>$('#status').textContent='생성 중… '+Math.round((Date.now()-t0)/1000)+'초',500);try{const j=await(await fetch(base+'/generate',{method:'POST',body:fd})).json();clearInterval(tick);if(j.error){$('#status').textContent='생성에 실패했습니다: '+j.error;return}$('#status').textContent=`완료 · ${j.wall_seconds}초`;$('#empty').style.display='none';$('#v').style.display='block';$('#v').src=base+j.mp4;const a=document.createElement('a');a.href=base+j.mp4;a.textContent='영상 다운로드';a.download=j.job+'.mp4';$('#hist').prepend(a)}catch(e){clearInterval(tick);$('#status').textContent='생성에 실패했습니다. 잠시 후 다시 시도해주세요.'}finally{$(`#go`).disabled=false}};</script></body></html>
