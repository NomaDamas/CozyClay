<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CozyClay · 노드 캔버스</title><style>
:root{--bg:#101318;--panel:#171c24;--line:#2a3442;--text:#e8edf5;--muted:#8995a5;--blue:#6ea8ff;--green:#4bd49a;--red:#ff6574}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif}#top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;background:#131820}#brand{font-weight:700;font-size:15px}button{border:1px solid #344154;background:#202938;color:var(--text);border-radius:7px;padding:8px 13px;font:inherit;cursor:pointer}button:hover{border-color:var(--blue)}#run{background:#3e83ff;border-color:#5693ff;font-weight:700;padding:9px 18px}.spacer{flex:1}#status{color:var(--muted)}#workspace{position:relative;height:calc(100% - 54px);overflow:hidden;background-color:#11161d;background-image:radial-gradient(#2a3442 1px,transparent 1px);background-size:24px 24px;cursor:grab}.node{position:absolute;width:270px;background:var(--panel);border:1px solid #344154;border-radius:10px;box-shadow:0 12px 30px #0005;user-select:none}.node.running{border-color:var(--blue);box-shadow:0 0 0 2px #4f8cff55}.node.done{border-color:var(--green)}.node.error{border-color:var(--red)}.head{height:38px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;cursor:move}.head .tag{font-size:11px;color:var(--muted);font-weight:500}.body{padding:12px}.node label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.node textarea,.node input,.node select{width:100%;background:#0e1218;border:1px solid #344154;color:var(--text);border-radius:6px;padding:8px;font:inherit;margin-bottom:10px}.node textarea{height:74px;resize:vertical}.port{height:18px;margin:4px -4px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);display:inline-block}.out{justify-content:flex-end}.out .dot{background:var(--green)}.advanced{border-top:1px solid var(--line);padding-top:8px}.advanced summary{cursor:pointer;color:var(--muted);margin-bottom:8px}.thumb{height:100px;border-radius:6px;background:#0c1015;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:10px}.progress{height:4px;background:#28364a;border-radius:3px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue);width:55%}.check{color:var(--green)}.errmsg{color:var(--red);font-size:12px;margin-top:6px}.video{height:110px;background:#080b0f;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:8px}.toast{position:fixed;right:18px;bottom:18px;background:#4a1f29;border:1px solid var(--red);padding:12px 16px;border-radius:8px;display:none}.menu{position:fixed;background:#202938;border:1px solid #43516a;border-radius:7px;padding:6px;display:none;z-index:5;box-shadow:0 8px 24px #0008}.menu div{padding:7px 12px;border-radius:4px;cursor:pointer}.menu div:hover{background:#33445e}#hint{position:absolute;bottom:12px;left:16px;color:#718096;font-size:12px}.link{position:absolute;height:2px;background:var(--blue);transform-origin:left center;opacity:.75}.search{position:fixed;display:none;z-index:4;background:#202938;border:1px solid #50627e;border-radius:9px;padding:10px;width:250px}.search input{width:100%;background:#11161d;border:1px solid #3b4b63;color:white;padding:8px;border-radius:6px}.search div{padding:8px;color:#dbe6f5}
</style></head><body><header id="top"><div id="brand">CozyClay <span style="color:#78879a;font-weight:500">노드 캔버스</span></div><button id="run">▶ 실행 <small>Ctrl+Enter</small></button><button id="fit">맞춤</button><button id="reset">기본 프리셋</button><span class="spacer"></span><span id="status">준비됨</span></header><main id="workspace"><div id="hint">빈 공간 더블클릭: 노드 검색 · 우클릭: 메뉴 · Space+드래그: 이동 · 휠: 확대/축소</div></main><div id="menu" class="menu"><div data-act="add">노드 추가</div><div data-act="collapse">접기/펼치기</div><div data-act="bypass">우회</div><div data-act="delete">삭제</div></div><div id="search" class="search"><input placeholder="노드 검색…"><div>Reference Image</div><div>Scene</div><div>Generate Video</div><div>Result</div></div><div id="toast" class="toast"></div><script>
const ws=document.querySelector('#workspace'), statusEl=document.querySelector('#status'), toast=document.querySelector('#toast');let scale=1,pan={x:0,y:0},drag=null,selected=null,running=false;const defs=[['Reference Image','ref',80,130],['Scene','scene',430,100],['Generate Video','gen',800,145],['Result','result',1160,130]];function node(title,type,x,y){let e=document.createElement('section');e.className='node';e.dataset.type=type;e.style.left=x+'px';e.style.top=y+'px';let body='';if(type==='ref')body='<div class="thumb">이미지를 선택하세요</div><button class="pick">이미지 업로드</button><div class="port out"><span>image</span><i class="dot"></i></div>';if(type==='scene')body='<label>장면 설명</label><textarea placeholder="인물이 천천히 고개 숙여 인사한다…"></textarea><div class="port out"><span>prompt</span><i class="dot"></i></div>';if(type==='gen')body='<label>길이 (초)</label><input type="number" value="5" min="1" max="15"><label>화면 비율</label><select><option>16:9</option><option>9:16</option><option>1:1</option></select><label>시드</label><input type="number" value="42"><details class="advanced"><summary>고급 설정</summary><label>Steps</label><input type="number" value="4"><label>Megapixels</label><input type="number" value="0.4" step="0.1"></details><div class="port"><i class="dot"></i><span>conditioning</span></div><div class="port out"><span>video</span><i class="dot"></i></div>';if(type==='result')body='<div class="video">생성된 영상이 여기에 표시됩니다</div><button>재생</button> <button>다운로드</button><div style="color:var(--muted);margin-top:8px">대기 시간 —</div>';e.innerHTML='<div class="head"><span>'+title+'</span><span class="tag">'+(type==='gen'?'생성':'기본')+'</span></div><div class="body">'+body+'</div>';ws.appendChild(e);e.querySelector('.head').onmousedown=ev=>{if(ev.button!==0)return;selected=e;drag={e,ox:ev.clientX-e.offsetLeft,oy:ev.clientY-e.offsetTop};ev.stopPropagation()};e.onmousedown=ev=>{selected=e;ev.stopPropagation()};return e}function render(){document.querySelectorAll('.node').forEach(n=>{n.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')';n.style.transformOrigin='0 0'});document.querySelectorAll('.link').forEach(x=>x.remove());const ns=[...document.querySelectorAll('.node')];for(let i=0;i<3;i++){let a=ns[i],b=ns[i+1];let x=a.offsetLeft+a.offsetWidth,y=a.offsetTop+45,x2=b.offsetLeft,y2=b.offsetTop+45,len=Math.hypot(x2-x,y2-y),ang=Math.atan2(y2-y,x2-x)*180/Math.PI,l=document.createElement('div');l.className='link';l.style.left=x+'px';l.style.top=y+'px';l.style.width=len+'px';l.style.transform='rotate('+ang+'deg)';ws.appendChild(l)}}function reset(){document.querySelectorAll('.node').forEach(n=>n.remove());defs.forEach(d=>node(...d));render()}reset();
ws.onmousedown=e=>{if(e.target!==ws)return;drag={pan:true,ox:e.clientX-pan.x,oy:e.clientY-pan.y};ws.style.cursor='grabbing'};window.onmousemove=e=>{if(!drag)return;if(drag.pan){pan.x=e.clientX-drag.ox;pan.y=e.clientY-drag.oy}else{drag.e.style.left=(e.clientX-drag.ox)+'px';drag.e.style.top=(e.clientY-drag.oy)+'px'}render()};window.onmouseup=()=>{drag=null;ws.style.cursor='grab'};ws.onwheel=e=>{e.preventDefault();scale=Math.max(.55,Math.min(1.5,scale*(e.deltaY<0?1.1:.9)));render()};ws.ondblclick=e=>{if(e.target!==ws)return;let s=document.querySelector('#search');s.style.display='block';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.querySelector('input').focus()};ws.oncontextmenu=e=>{e.preventDefault();let m=document.querySelector('#menu');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px'};document.body.onclick=e=>{if(!e.target.closest('.menu')&&!e.target.closest('.search')){document.querySelector('#menu').style.display='none';document.querySelector('#search').style.display='none'}};document.querySelector('#menu').onclick=e=>{let act=e.target.dataset.act;if(act==='delete'&&selected)selected.remove();if(act==='collapse'&&selected)selected.querySelector('.body').hidden=!selected.querySelector('.body').hidden;if(act==='add')node('Scene','scene',250,200);document.querySelector('#menu').style.display='none';render()};document.querySelector('#fit').onclick=()=>{scale=1;pan={x:0,y:0};render()};document.querySelector('#reset').onclick=reset;document.querySelector('#run').onclick=run;document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();statusEl.textContent='되돌림 완료'}};async function run(){if(running)return;running=true;statusEl.textContent='생성 중…';let ns=[...document.querySelectorAll('.node')];ns.forEach((n,i)=>setTimeout(()=>{n.classList.add('running');if(i)ns[i-1].classList.remove('running'),ns[i-1].classList.add('done');if(i===2)n.querySelector('.body').insertAdjacentHTML('beforeend','<div class="progress"><i></i></div>')},i*500));setTimeout(()=>{ns.forEach(n=>{n.classList.remove('running');n.classList.add('done')});ns[3].querySelector('.video').textContent='▶ 결과 영상 (mock)';ns[3].querySelector('div:last-child').textContent='벽 시간 2.4초';statusEl.textContent='완료 · 2.4초';running=false},2200)}
</script></body></html>
