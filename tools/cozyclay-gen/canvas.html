<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cozyclay-gen canvas</title>
<link rel="stylesheet" href="https://unpkg.com/litegraph.js@0.7.18/css/litegraph.css">
<style>
  html,body{margin:0;height:100%;background:#151515;color:#ddd;font:13px -apple-system,system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1d1d1d;border-bottom:1px solid #2c2c2c;z-index:5}
  #bar b{margin-right:8px}
  #bar button{background:#2b2b2b;color:#eee;border:1px solid #3a3a3a;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
  #bar button.run{background:#4f8cff;border-color:#4f8cff;font-weight:600}
  #bar button:disabled{opacity:.5;cursor:wait}
  #status{margin-left:auto;color:#9a9a9a;font-size:12px}
  #c{position:fixed;top:42px;left:0;width:100vw;height:calc(100vh - 42px)}
  #editor{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #editor .box{width:min(900px,90vw);background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px}
  #editor textarea{width:100%;height:50vh;background:#0e0e0e;color:#eee;border:1px solid #333;border-radius:6px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;box-sizing:border-box}
  #editor .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .litegraph .dialog{z-index:20}
  #hint{position:fixed;left:12px;bottom:10px;color:#666;font-size:11px}
  textarea.nodeText{position:fixed;z-index:3;background:#0e0e0e;color:#eee;border:1px solid #3a3a3a;border-radius:6px;padding:6px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:none;box-sizing:border-box;display:none}
  textarea.nodeText:focus{outline:1px solid #4f8cff}
  .nodeDom{position:fixed;z-index:3;background:#0e0e0e;color:#eee;border:1px solid #3a3a3a;border-radius:5px;padding:0 6px;font:12px -apple-system,system-ui,sans-serif;box-sizing:border-box;display:none;height:20px}
  .nodeDom:focus{outline:1px solid #4f8cff}
  input.nodeDom[type=number]{-moz-appearance:textfield}
  .nodeDom.chk{width:18px;padding:0;accent-color:#4f8cff}
</style>
</head>
<body>
<div id="bar">
  <b>cozyclay-gen</b>
  <button class="run" id="run">Run (Ctrl+Enter)</button>
  <button id="default">Mocap preset</button>
  <button id="save">Save</button>
  <button id="load">Load</button>
  <button id="export">Export JSON</button>
  <button id="import">Import JSON</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <input type="file" id="uploadFile" accept="image/*" hidden>
  <span id="status">…</span>
</div>
<canvas id="c"></canvas>
<div id="hint">double-click: search nodes · right-click: add node · click a prompt widget: editor · Ctrl+Enter: run</div>
<div id="editor"><div class="box"><div id="edTitle" style="margin-bottom:8px;color:#aaa"></div><textarea id="edText"></textarea><div class="btns"><button id="edCancel">Cancel</button><button id="edOk" style="background:#4f8cff;color:#fff;border:0;border-radius:6px;padding:6px 14px">OK</button></div></div></div>
<script src="https://unpkg.com/litegraph.js@0.7.18/build/litegraph.min.js"></script>
<script>
const base = location.origin;
const PRESET_IMAGE = 'preset_female_gray_34.png'; // shipped with the service (presets/), 3/4 slightly elevated mocap angle
const $ = s => document.querySelector(s);
const status = t => $('#status').textContent = t;

// ---------- multiline editor ----------
function editText(title, value) {
  return new Promise(res => {
    $('#edTitle').textContent = title; $('#edText').value = value || '';
    $('#editor').style.display = 'flex'; $('#edText').focus();
    const close = v => { $('#editor').style.display = 'none'; $('#edOk').onclick = $('#edCancel').onclick = null; res(v); };
    $('#edOk').onclick = () => close($('#edText').value);
    $('#edCancel').onclick = () => close(null);
  });
}

// ---------- node registration from /nodes ----------
const PRIMS = new Set(['STRING', 'INT', 'FLOAT', 'BOOL', 'COMBO', 'IMAGEFILE']);
const LABELS = {image:'이미지', scene:'장면 설명', direct:'직접 입력', manual_prompt:'완성 프롬프트', seconds:'길이(초)', aspect:'화면 비율', seed:'시드', steps:'Steps', sla:'SLA', megapixels:'Megapixels', audio:'오디오'};
const imgCache = {};
function registerNode(def) {
  function N() {
    this.def = def;
    this.widgetsByName = {};
    for (const i of def.inputs) {
      if (!PRIMS.has(i.type)) { this.addInput(i.name, i.type); continue; }
      let w;
      if (i.type === 'STRING' && i.multiline) {
        w = this.addWidget('button', LABELS[i.name] || i.name, i.default || '', () => editText(`${def.name} · ${i.name}`, w.value).then(v => { if (v !== null) { w.value = v; if (w.ta) w.ta.value = v; this.setDirtyCanvas(true); } }));
        w.multiline = true;
        const ta = document.createElement('textarea'); ta.className = 'nodeText'; ta.placeholder = i.placeholder || i.name; ta.value = w.value;
        ta.oninput = () => { w.value = ta.value; }; ta.onmousedown = e => e.stopPropagation(); ta.onwheel = e => e.stopPropagation();
        document.body.appendChild(ta); w.ta = ta;
        this.textAreas = this.textAreas || []; this.textAreas.push(w);
      } else if (i.type === 'STRING') {
        w = this.addWidget('text', LABELS[i.name] || i.name, i.default || '', v => { w.value = v; });
      } else if (i.type === 'INT') {
        w = this.addWidget('number', LABELS[i.name] || i.name, i.default ?? 0, v => { w.value = Math.round(v); }, { min: i.min ?? 0, max: i.max ?? 1e9, step: 10, precision: 0 });
      } else if (i.type === 'FLOAT') {
        w = this.addWidget('number', LABELS[i.name] || i.name, i.default ?? 0, v => { w.value = v; }, { min: i.min ?? 0, max: i.max ?? 1e9, step: (i.step ?? 0.1) * 10, precision: 2 });
      } else if (i.type === 'BOOL') {
        w = this.addWidget('toggle', LABELS[i.name] || i.name, !!i.default, v => { w.value = v; });
      } else if (i.type === 'COMBO') {
        w = this.addWidget('combo', LABELS[i.name] || i.name, i.default, v => { w.value = v; }, { values: i.options || [] });
      } else if (i.type === 'IMAGEFILE') {
        w = this.addWidget('button', i.name, i.default || '(choose image)', () => {
          const inp = $('#uploadFile'); inp.onchange = async () => {
            const f = inp.files[0]; if (!f) return;
            const fd = new FormData(); fd.append('image', f, f.name);
            const j = await (await fetch(base + '/upload', { method: 'POST', body: fd })).json();
            w.value = j.files[0]; this.loadThumb(); this.setDirtyCanvas(true); inp.value = '';
          }; inp.click();
        });
        w.isImage = true;
      }
      if (w) {
        w.inputName = i.name; w.inputType = i.type; this.widgetsByName[i.name] = w;
        if (i.type !== 'IMAGEFILE') this.addInput(i.name, i.type);
        // native DOM control drawn over the widget row: numbers, combos, toggles, one-line text
        let el = null;
        if (i.type === 'INT' || i.type === 'FLOAT') {
          el = document.createElement('input'); el.type = 'number'; el.min = i.min ?? ''; el.max = i.max ?? ''; el.step = i.type === 'INT' ? 1 : (i.step ?? 0.1); el.value = w.value;
          el.onchange = el.oninput = () => { const v = Number(el.value); if (!Number.isNaN(v)) { w.value = i.type === 'INT' ? Math.round(v) : v; this.setDirtyCanvas(true); } };
        } else if (i.type === 'COMBO') {
          el = document.createElement('select'); (i.options || []).forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; el.appendChild(op); }); el.value = w.value;
          el.onchange = () => { w.value = el.value; this.setDirtyCanvas(true); };
        } else if (i.type === 'BOOL') {
          el = document.createElement('input'); el.type = 'checkbox'; el.className = 'chk'; el.checked = !!w.value;
          el.onchange = () => { w.value = el.checked; this.setDirtyCanvas(true); };
        } else if (i.type === 'STRING' && !i.multiline) {
          el = document.createElement('input'); el.type = 'text'; el.value = w.value || '';
          el.oninput = () => { w.value = el.value; };
        }
        if (el) { el.classList.add('nodeDom'); el.onmousedown = e => e.stopPropagation(); el.onwheel = e => e.stopPropagation(); el.onkeydown = e => e.stopPropagation(); document.body.appendChild(el); w.dom = el; (this.domWidgets = this.domWidgets || []).push(w); }
      }
    }
    for (const o of def.outputs) this.addOutput(o.name, o.type);
    this.serialize_widgets = true;
    this.color = { input: '#244a68', prompt: '#4b3c68', generate: '#345f4b', output: '#684536', advanced: '#30343d', h3: '#30343d' }[def.category] || '#222'; this.bgcolor = this.color; this.boxcolor = '#445';
  }
  N.title = ({'Reference Image':'참조 이미지','Scene':'장면','Generate Video':'영상 생성','Result':'결과'}[def.name] || def.name) + (def.name === 'Generate Video' ? ' · 고급 설정은 숨김' : '');
  N.desc = def.description;
  // LiteGraph recomputes size after construction; enforce a minimum so previews have room
  const hasImage = def.inputs.some(i => i.type === 'IMAGEFILE');
  const isOutput = def.outputs.length === 0;
  const isText = def.inputs.some(i => i.type === 'STRING' && i.multiline) && def.category === 'prompt';
  N.prototype.computeSize = function (out) {
    const sz = LGraphNode.prototype.computeSize.call(this, out);
    if (hasImage) { sz[0] = Math.max(sz[0], 260); sz[1] = Math.max(sz[1], 250); }
    if (isOutput) { sz[0] = Math.max(sz[0], 420); sz[1] = Math.max(sz[1], 300); }
    if (isText) { sz[0] = Math.max(sz[0], 420); sz[1] = Math.max(sz[1], 260); }
    return sz;
  };
  N.prototype.onAdded = function () { const m = this.computeSize(); if (this.size[0] < m[0] || this.size[1] < m[1]) this.size = m; };
  N.prototype.loadThumb = function () {
    const w = this.widgetsByName.image; if (!w || !w.value || w.value.startsWith('(')) return;
    const img = new Image(); img.src = base + '/input/' + encodeURIComponent(w.value); img.onload = () => { this.thumb = img; this.setDirtyCanvas(true); };
  };
  N.prototype.onConnectionsChange = function () {
    for (const w of (this.widgets || [])) { const slot = this.findInputSlot(w.inputName); const linked = slot >= 0 && this.inputs[slot].link != null; w.disabled = linked; w.name = linked ? w.inputName + ' (from link)' : w.inputName; }
  };
  N.prototype.onDrawBackground = function (ctx) {
    if (this.flags.collapsed) return;
    const wh = this.widgets ? this.widgets.length * 24 + 10 : 10;
    const y0 = wh, h = this.size[1] - wh - 6, wdt = this.size[0] - 12;
    if (this.thumb && h > 20) {
      const s = Math.min(wdt / this.thumb.width, h / this.thumb.height);
      const tw = this.thumb.width * s, th = this.thumb.height * s;
      ctx.drawImage(this.thumb, 6 + (wdt - tw) / 2, y0, tw, th);
    } else if (hasImage && h > 20) {
      ctx.save(); ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.fillText('no image · click the button to upload', 8, y0 + 16); ctx.restore();
    }
    if (this.lastText && !this.videoEl && h > 20 && !(this.textAreas && this.textAreas.length)) {
      ctx.save(); ctx.fillStyle = '#9c9'; ctx.font = '11px ui-monospace, Menlo, monospace';
      const lines = this.lastText.split('\n').filter(Boolean).slice(0, Math.floor(h / 14));
      lines.forEach((l, i) => ctx.fillText(l.slice(0, Math.floor(wdt / 6.2)), 8, y0 + 14 + i * 14));
      ctx.fillStyle = '#666'; ctx.fillText('double-click to read the generated prompt', 8, y0 + h - 4); ctx.restore();
    }
    if (isOutput && !this.videoEl && h > 20) { ctx.save(); ctx.fillStyle='#777'; ctx.font='13px sans-serif'; ctx.fillText('영상 결과가 여기에 표시됩니다', 12, y0 + 32); ctx.restore(); }
    if (this.videoEl && h > 20) {
      const v = this.videoEl; if (v.videoWidth) {
        const s = Math.min(wdt / v.videoWidth, h / v.videoHeight);
        ctx.drawImage(v, 6, y0, v.videoWidth * s, v.videoHeight * s);
      }
      this.setDirtyCanvas(true);
    }
  };
  N.prototype.onConfigure = function () { setTimeout(() => this.loadThumb && this.loadThumb(), 50); for (const w of (this.textAreas || [])) if (w.ta) w.ta.value = w.value || ''; };
  N.prototype.onRemoved = function () { for (const w of (this.textAreas || [])) w.ta && w.ta.remove(); for (const w of (this.domWidgets || [])) w.dom && w.dom.remove(); };
  N.prototype.onDrawForeground = function (ctx) {
    const ds = canvas.ds, top = 42;
    for (const w of (this.domWidgets || [])) {
      const el = w.dom; if (!el) continue;
      const linked = this.inputs?.some(inp => inp.name === w.inputName && inp.link != null);
      if (this.flags.collapsed || linked || ds.scale < 0.5 || w.last_y == null) { el.style.display = 'none'; continue; }
      const rowW = this.size[0], isChk = el.type === 'checkbox';
      const wpx = isChk ? 18 : Math.max(70, rowW * 0.42);
      const x = (this.pos[0] + rowW - 8 - wpx + ds.offset[0]) * ds.scale, y = (this.pos[1] + w.last_y + 1 + ds.offset[1]) * ds.scale + top;
      if (def.name === 'Generate Video' && ['steps','sla','megapixels','audio'].includes(w.inputName)) { el.style.display='none'; continue; }
      if (def.name === 'Scene' && w.inputName === 'manual_prompt' && !this.widgetsByName.direct?.value) { el.style.display='none'; continue; }
      Object.assign(el.style, { display: 'block', left: x + 'px', top: y + 'px', width: wpx * ds.scale + 'px', height: 18 * ds.scale + 'px', fontSize: 12 * ds.scale + 'px' });
      if (document.activeElement !== el) { if (isChk) el.checked = !!w.value; else if (String(el.value) !== String(w.value ?? '')) el.value = w.value ?? ''; }
    }
    if (!this.textAreas || !this.textAreas.length) return;
    const wh = (this.widgets ? this.widgets.length * 24 : 0) + Math.max(this.inputs?.length || 0, this.outputs?.length || 0) * 20 + 10;
    const areaH = this.size[1] - wh - 6, per = Math.max(30, areaH / this.textAreas.length - 6);
    this.textAreas.forEach((w, k) => {
      const ta = w.ta; if (!ta) return;
      const linked = this.inputs?.some(inp => inp.name === w.inputName && inp.link != null);
      if (this.flags.collapsed || linked || areaH < 40 || ds.scale < 0.45) { ta.style.display = 'none'; return; }
      const x = (this.pos[0] + 6 + ds.offset[0]) * ds.scale, y = (this.pos[1] + wh + k * (per + 6) + ds.offset[1]) * ds.scale + top;
      Object.assign(ta.style, { display: 'block', left: x + 'px', top: y + 'px', width: (this.size[0] - 12) * ds.scale + 'px', height: per * ds.scale + 'px', fontSize: 12 * ds.scale + 'px' });
      if (document.activeElement !== ta && ta.value !== (w.value || '')) ta.value = w.value || '';
    });
  };
  const _onAdded = N.prototype.onAdded; N.prototype.onAdded = function () { _onAdded.call(this); setTimeout(() => this.loadThumb && this.loadThumb(), 50); };
  N.prototype.setVideo = function (url) {
    if (!this.videoEl) { this.videoEl = document.createElement('video'); this.videoEl.muted = true; this.videoEl.loop = true; this.videoEl.autoplay = true; this.videoEl.playsInline = true; }
    this.videoEl.src = url; this.videoEl.play().catch(() => {}); this.videoUrl = url;
  };
  N.prototype.onDblClick = function (e, pos) { if (this.videoUrl) window.open(this.videoUrl, '_blank'); else if (this.lastText) editText(`${def.name} · generated prompt (read-only)`, this.lastText); };
  N.prototype.getExtraMenuOptions = function () { return this.videoUrl ? [{ content: 'Download mp4', callback: () => { const a = document.createElement('a'); a.href = this.videoUrl; a.download = ''; a.click(); } }] : []; };
  LiteGraph.registerNodeType(`${def.category}/${def.name}`, N);
}

// ---------- graph -> API json ----------
function toApi(graph) {
  const out = {};
  for (const n of graph._nodes) {
    const inputs = {};
    for (const w of (n.widgets || [])) if (w.inputName) inputs[w.inputName] = w.value;
    for (let s = 0; s < (n.inputs || []).length; s++) {
      const inp = n.inputs[s]; if (inp.link == null) continue;
      const link = graph.links[inp.link]; if (!link) continue;
      inputs[inp.name] = [String(link.origin_id), link.origin_slot];
    }
    out[String(n.id)] = { type: n.def.name, inputs };
  }
  return out;
}

// ---------- run ----------
let running = false;
async function run() {
  if (running) return; running = true; $('#run').disabled = true; status('starting…');
  graph._nodes.forEach(n => { n.boxcolor = null; });
  const t0 = Date.now();
  try {
    const r = await fetch(base + '/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ graph: toApi(graph) }) });
    const { run: id } = await r.json();
    while (true) {
      await new Promise(r => setTimeout(r, 700));
      const st = await (await fetch(base + '/run/' + id)).json();
      const el = ((Date.now() - t0) / 1000).toFixed(0);
      if (st.status === 'running') {
        status(`running ${st.i + 1}/${st.total}: ${st.node_type}  (${el}s)`);
        graph._nodes.forEach(n => { n.boxcolor = String(n.id) === String(st.node) ? '#4f8cff' : n.boxcolor; });
        canvas.setDirty(true, true);
      } else if (st.status === 'done') {
        status(`done in ${st.wall}s`);
        for (const [nid, ui] of Object.entries(st.ui || {})) {
          const n = graph.getNodeById(Number(nid)); if (!n) continue;
          if (ui.node_output && ui.node_output.video) { n.setVideo(base + ui.node_output.video); n.boxcolor = '#3c3'; }
          if (ui.text) { n.lastText = ui.text; n.boxcolor = '#3c3'; n.title = n.def.name + '  ·  double-click: generated prompt'; }
        }
        canvas.setDirty(true, true); break;
      } else if (st.status === 'error') { status('error: ' + st.error); graph._nodes.forEach(n => { if (String(n.id) === String(st.node)) n.boxcolor = '#d44'; }); const t=document.createElement('div'); t.textContent='오류: '+st.error; Object.assign(t.style,{position:'fixed',right:'16px',bottom:'16px',padding:'10px 14px',background:'#54232b',color:'#fff',border:'1px solid #d44',borderRadius:'6px',zIndex:20}); document.body.appendChild(t); setTimeout(()=>t.remove(),5000); canvas.setDirty(true,true); break; }
    }
  } catch (e) { status('error: ' + e); }
  finally { running = false; $('#run').disabled = false; }
}

// ---------- default graph ----------
function clearTextAreas() { document.querySelectorAll('textarea.nodeText, .nodeDom').forEach(t => t.remove()); }
async function defaultGraph() {
  clearTextAreas(); graph.clear();
  try {
    const preset = await (await fetch(base + '/preset')).json();
    graph.configure(preset); graph._nodes.forEach(n => { n.loadThumb && n.loadThumb(); n.onConnectionsChange && n.onConnectionsChange(); });
  } catch (e) { status('preset load failed: ' + e); }
  canvas.setDirty(true, true);
}

// ---------- boot ----------
const graph = new LGraph();
const canvas = new LGraphCanvas('#c', graph);
canvas.allow_searchbox = true; canvas.show_info = false; canvas.render_canvas_border = false; canvas.snap_to_grid = true; canvas.grid_size = 20;
function resize() { const c = $('#c'); c.width = innerWidth; c.height = innerHeight - 42; canvas.resize(); }
addEventListener('resize', resize); resize();
LiteGraph.clearRegisteredTypes && LiteGraph.clearRegisteredTypes();

(async () => {
  const defs = await (await fetch(base + '/nodes')).json();
  defs.forEach(registerNode);
  const saved = localStorage.getItem('cozyclay-gen-graph');
  if (saved) { try { clearTextAreas(); graph.configure(JSON.parse(saved)); graph._nodes.forEach(n => n.loadThumb && n.loadThumb()); } catch (e) { defaultGraph(); } } else await defaultGraph();
  const h = await (await fetch(base + '/health')).json();
  status(h.models_loaded ? `ready · ${defs.length} node types` : 'loading models…');
})();

$('#run').onclick = run;
$('#default').onclick = () => { if (confirm('기본 프리셋으로 바꿀까요?')) defaultGraph(); };
$('#save').onclick = () => { localStorage.setItem('cozyclay-gen-graph', JSON.stringify(graph.serialize())); status('saved (browser storage)'); };
$('#load').onclick = () => { const s = localStorage.getItem('cozyclay-gen-graph'); if (s) { clearTextAreas(); graph.configure(JSON.parse(s)); graph._nodes.forEach(n => n.loadThumb && n.loadThumb()); status('loaded'); } };
$('#export').onclick = () => { const a = document.createElement('a'); a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(graph.serialize(), null, 1)); a.download = 'cozyclay-graph.json'; a.click(); };
$('#import').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; clearTextAreas(); graph.configure(JSON.parse(await f.text())); graph._nodes.forEach(n => n.loadThumb && n.loadThumb()); e.target.value = ''; };
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });
</script>
</body>
</html>
