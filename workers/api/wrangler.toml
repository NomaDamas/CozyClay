name = "cozyclay-demo-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
routes = [{ pattern = "api.cozyclay.org", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://cozyclay.org"
API_ORIGIN = "https://api.cozyclay.org"
GOOGLE_CLIENT_ID = "450339080716-n1bj2eiiudokr04d4tt9btg80kph8dgi.apps.googleusercontent.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAEbNDDTxohyi9XFd"
# Secrets are configured with `wrangler secret put`, never committed:
# GOOGLE_CLIENT_SECRET
# CC_WORKER_SECRET
# SESSION_SIGNING_KEY
# TURNSTILE_SECRET_KEY
# Motion generation is deliberately disabled until the owner finishes production QA.
# Enable explicitly with `MOTION_GENERATION_ENABLED = "true"`.
MOTION_GENERATION_ENABLED = "false"
FAL_CLIP_COST_USD = "0.0625"

[[d1_databases]]
binding = "DB"
database_name = "cozyclay-demo"
database_id = "8319244c-ea60-4de2-92b3-bedb4ef369c3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RESULTS"
bucket_name = "cozyclay-demo-results"
# No public bucket domain: results are served only through /r/:token.npz.

[triggers]
crons = ["*/5 * * * *"]

[env.development]
name = "cozyclay-demo-api-dev"
[env.development.vars]
ENVIRONMENT = "development"
SITE_ORIGIN = "http://127.0.0.1:5180"
API_ORIGIN = "http://127.0.0.1:8787"
GOOGLE_CLIENT_ID = "replace-with-development-google-client-id"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
MOTION_GENERATION_ENABLED = "false"

[[env.development.d1_databases]]
binding = "DB"
database_name = "cozyclay-demo"
database_id = "8319244c-ea60-4de2-92b3-bedb4ef369c3"
migrations_dir = "migrations"

[[env.development.r2_buckets]]
binding = "RESULTS"
bucket_name = "cozyclay-demo-results"
